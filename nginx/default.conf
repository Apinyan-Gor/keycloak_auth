server {
    listen 80;
    server_name _;

    # Serve Nuxt at root
    location / {
        proxy_pass http://nuxt-app:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy Nuxt HMR / Vite and static assets
    location ~ ^/_nuxt/ {
        proxy_pass http://nuxt-app:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Optional alias for older config that used /app/
    location /app/ {
        proxy_pass http://nuxt-app:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy Keycloak under /keycloak/.
    # Allow direct typing /keycloak by setting a short-lived cookie here, and then proxy.
    location ~ ^/keycloak(/|$) {
        # Set short-lived cookie so subsequent Keycloak subrequests are allowed by the cookie-check
        add_header Set-Cookie "allow_keycloak=1; Path=/; Max-Age=10; HttpOnly" always;

        # For extra safety, you can still enforce cookie-check for deeper endpoints if desired
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve original request URI so Keycloak receives /keycloak/... paths
        proxy_pass http://keycloak:8080$request_uri;
    }

    # Also proxy Keycloak internal API paths just in case some links don't include /keycloak
    location ~ ^/(realms|auth|admin|protocol) {
        if ($cookie_allow_keycloak != "1") {
            return 403;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://keycloak:8080$request_uri;
    }
}
